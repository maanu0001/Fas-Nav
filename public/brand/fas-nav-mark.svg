<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fas-Nav.ch">
  <!--
    FN-Signet, abgeleitet aus dem Fas-Nav-Logo.

    Das vollständige Logo ist für kleine Flächen zu fein gezeichnet. Dieses
    Signet nimmt daraus den charakteristischen Teil auf: die Buchstabenform FN
    und die drei Fasnachtsfarben. Die Navy-Fläche sorgt dafür, dass das Zeichen
    in hellen wie dunklen Browserleisten gleich gut steht.
  -->
  <rect width="64" height="64" rx="14" fill="#0B1A30" />

  <!-- FN in der Grundfarbe des Logos, hell auf Navy. -->
  <g fill="#F7FAFC">
    <!-- F -->
    <rect x="12" y="18" width="7" height="28" rx="1" />
    <rect x="12" y="18" width="18" height="6.5" rx="1" />
    <rect x="12" y="28.5" width="15" height="6" rx="1" />
    <!-- N -->
    <rect x="34" y="18" width="7" height="28" rx="1" />
    <rect x="47" y="18" width="7" height="28" rx="1" />
    <polygon points="34,18 41,18 54,46 47,46" />
  </g>

  <!-- Die drei Fasnachtsfarben als Akzentkante. -->
  <g>
    <rect x="12" y="50" width="14" height="4" rx="2" fill="#C2171F" />
    <rect x="27" y="50" width="14" height="4" rx="2" fill="#FEAA19" />
    <rect x="42" y="50" width="12" height="4" rx="2" fill="#0279AD" />
  </g>
</svg>
