# Produktionsüberschreibungen.
# Aufruf: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  db:
    # Die Datenbank ist von aussen nicht erreichbar.
    ports: []
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups

  app:
    environment:
      NODE_ENV: production
    # Hinter einem Reverse Proxy (nginx, Traefik, Caddy) mit TLS betreiben.
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  db_data:
  uploads:
