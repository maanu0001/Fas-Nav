# Grundsetup für Fas-Nav.ch.
#
# Diese Datei veröffentlicht bewusst keine Ports. Welche Ports nach aussen
# sichtbar sind, entscheidet allein die jeweilige Umgebung:
#   Entwicklung: docker-compose.override.yml (wird von "docker compose" automatisch geladen)
#   Produktion:  docker-compose.prod.yml
#
# Grund: Compose hängt Ports aus mehreren Dateien aneinander, statt sie zu
# ersetzen. Stünde hier eine Veröffentlichung, liesse sie sich in der
# Produktion nicht mehr zurücknehmen.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fasnav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fasnav}
      POSTGRES_DB: ${POSTGRES_DB:-fasnav}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fasnav} -d ${POSTGRES_DB:-fasnav}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fasnav}:${POSTGRES_PASSWORD:-fasnav}@db:5432/${POSTGRES_DB:-fasnav}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss gesetzt sein}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/public/uploads
      NEXT_PUBLIC_UPLOAD_BASE_URL: /uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-8}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Fas-Nav.ch <noreply@fas-nav.ch>}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      # Merkwort für den geplanten Erinnerungslauf. Ohne Wert nimmt der
      # Endpunkt nur Aufrufe angemeldeter Administratoren an.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - uploads:/app/public/uploads

  # Einmalige Datenbankbefehle: Migrationen und Seed.
  #
  # Dieser Dienst läuft nicht mit "up" mit, sondern nur auf Zuruf:
  #   docker compose run --rm migrate                        # Migrationen
  #   docker compose run --rm migrate npx tsx prisma/seed.ts # Seed
  #
  # Er verwendet bewusst die Build-Stufe statt des Laufzeit-Images: Letzteres
  # enthält nur die Dateien, die zum Ausliefern der Anwendung nötig sind. Die
  # Prisma-CLI lädt ihre Konfiguration über @prisma/config und benötigt dafür
  # einen ganzen Baum weiterer Pakete (effect, c12 und deren Abhängigkeiten),
  # der dort fehlt. Die Build-Stufe ist ohnehin Teil des Anwendungs-Builds;
  # der Dienst kostet damit praktisch keine zusätzliche Bauzeit.
  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    profiles: ["tools"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fasnav}:${POSTGRES_PASSWORD:-fasnav}@db:5432/${POSTGRES_DB:-fasnav}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_TEAM_EMAIL: ${SEED_TEAM_EMAIL:-}
      SEED_TEAM_PASSWORD: ${SEED_TEAM_PASSWORD:-}
      SEED_ORG_PASSWORD: ${SEED_ORG_PASSWORD:-}

volumes:
  db_data:
  uploads:
